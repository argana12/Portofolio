<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ghozy Argana · Portfolio</title>

  <!-- Bootstrap 5 + Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- GSAP -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
</head>
<body>

  <!-- Grid Background (custom) -->
  <div class="bg-grid"></div>

  <div class="container py-5">

    <!-- Hero Section -->
    <section class="hero text-center">
      <h1 class="glow display-1 fw-bold">COMING SOON</h1>

      <p class="desc lead mx-auto">
        I’m building my next‑generation portfolio.<br>
        Previously worked in:
      </p>

      <!-- Skill badges -->
      <div class="skill-badges d-flex flex-wrap justify-content-center gap-2 mt-3">
        <span class="badge-skills"><i class="bi bi-shield-lock me-1"></i>Cyber Security</span>
        <span class="badge-skills"><i class="bi bi-cloud me-1"></i>Cloud Computing</span>
        <span class="badge-skills"><i class="bi bi-code-slash me-1"></i>Fullstack Web</span>
        <span class="badge-skills"><i class="bi bi-pc-display me-1"></i>Desktop Apps</span>
        <span class="badge-skills"><i class="bi bi-phone me-1"></i>Mobile Dev</span>
      </div>

      <!-- Profile photo (updated style) -->
      <div class="profile-wrapper mx-auto my-5">
        <img src="img/profile-full.png" alt="Ghozy Argana" class="profile-img">
      </div>

      <!-- Progress bar -->
      <div class="progress mx-auto" style="max-width: 280px;">
        <div class="bar" style="width: 75%;"></div>
      </div>
      <span class="progress-text d-block mt-2">Portfolio 75% in progress</span>
    </section>

    <!-- Certificates / Achievements -->
    <section class="certificates mt-5 pt-5">
      <h3 class="text-center mb-4 fw-light">Achievements</h3>

      <div class="row g-4">
        <!-- Cyber Juara 3 - dibuat potrait -->
        <div class="col-md-4 col-6">
          <div class="cert-card">
            <div class="cert-img portrait">
              <img src="img/cert-cyber-juara3.jpg" alt="Juara 3 Cyber" class="img-fluid">
            </div>
          </div>
        </div>
        <!-- Cloud cert -->
        <div class="col-md-4 col-6">
          <div class="cert-card">
            <div class="cert-img">
              <img src="img/cert-cloud.jpg" alt="Cloud Certification" class="img-fluid">
            </div>
          </div>
        </div>
        <!-- Cyber peserta -->
        <div class="col-md-4 col-6">
          <div class="cert-card">
            <div class="cert-img">
              <img src="img/cert-cyber-peserta.jpg" alt="Cyber Participant" class="img-fluid">
            </div>
          </div>
        </div>
      </div>
    </section>

  </div> <!-- .container -->

  <!-- Lightbox (tetap sama) -->
  <div id="lightbox"><img src="" alt=""></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
