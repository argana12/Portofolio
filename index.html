<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghozy Argana · Portfolio</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
</head>

<body>

<div class="bg-grid"></div>

<!-- HERO -->
<section class="hero-fullscreen">
  <div class="hero-content text-center">
    <h1 class="glow">COMING SOON</h1>

    <div class="progress-custom mx-auto">
      <div class="bar"></div>
    </div>

    <p class="progress-text">Portfolio 75% in progress</p>
  </div>

  <a href="#profile-section" class="arrow-down">
    <i class="bi bi-chevron-down"></i>
  </a>
</section>

<!-- PROFILE -->
<section id="profile-section" class="section">
  <div class="container-custom">
    <div class="row align-items-center g-5">

      <div class="col-lg-5 text-center">
        <img src="img/profile-full.png" class="profile-img">
      </div>

      <div class="col-lg-7">
        <p class="desc">
          I’m building my next-generation portfolio.<br>
          Previously worked in:
        </p>

        <div class="skill-badges">
          <span class="badge-skills"><i class="bi bi-shield-lock"></i>Cyber Security</span>
          <span class="badge-skills"><i class="bi bi-cloud"></i>Cloud Computing</span>
          <span class="badge-skills"><i class="bi bi-code-slash"></i>Fullstack Web</span>
          <span class="badge-skills"><i class="bi bi-pc-display"></i>Desktop Apps</span>
          <span class="badge-skills"><i class="bi bi-phone"></i>Mobile Dev</span>
        </div>
      </div>

    </div>
  </div>
</section>

<!-- ACHIEVEMENTS -->
<section class="section achievements-section">
  <div class="container-custom text-center">
    <h2 class="section-title">Achievements</h2>

    <div class="cert-grid">

      <div class="cert-card">
        <img src="img/cert-cyber-juara3.jpg">
      </div>

      <div class="cert-card">
        <img src="img/cert-cloud.jpg">
      </div>

      <div class="cert-card">
        <img src="img/cert-cyber-peserta.jpg">
      </div>

    </div>
  </div>
</section>

<!-- LIGHTBOX -->
<div id="lightbox">
  <span class="close-lightbox"><i class="bi bi-x-lg"></i></span>
  <img src="">
</div>

<script src="script.js"></script>
</body>
</html>
