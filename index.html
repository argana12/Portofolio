<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ghozy Argana · Portfolio</title>

  <!-- Bootstrap 5 + Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- GSAP -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <!-- ScrollTrigger -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
</head>
<body>

  <!-- Grid Background -->
  <div class="bg-grid"></div>

  <!-- SECTION 1: FULL SCREEN - COMING SOON & PROGRESS -->
  <section class="section-hero d-flex align-items-center justify-content-center">
    <div class="text-center">
      <h1 class="glow display-1 fw-bold">COMING SOON</h1>
      <div class="progress mx-auto my-4" style="max-width: 300px;">
        <div class="bar" style="width: 75%;"></div>
      </div>
      <span class="progress-text">Portfolio 75% in progress</span>
    </div>
  </section>

  <!-- SECTION 2: PROFILE & ABOUT -->
  <section class="section-profile py-5">
    <div class="container">
      <div class="row align-items-center">
        <div class="col-lg-5 text-center text-lg-start">
          <!-- Foto profil persegi tanpa bulat -->
          <img src="img/profile-full.png" alt="Ghozy Argana" class="profile-img img-fluid">
        </div>
        <div class="col-lg-7 mt-4 mt-lg-0">
          <p class="desc lead">
            I’m building my next‑generation portfolio.<br>
            Previously worked in:
          </p>
          <div class="skill-badges d-flex flex-wrap gap-2 mt-3">
            <span class="badge-skills"><i class="bi bi-shield-lock me-1"></i>Cyber Security</span>
            <span class="badge-skills"><i class="bi bi-cloud me-1"></i>Cloud Computing</span>
            <span class="badge-skills"><i class="bi bi-code-slash me-1"></i>Fullstack Web</span>
            <span class="badge-skills"><i class="bi bi-pc-display me-1"></i>Desktop Apps</span>
            <span class="badge-skills"><i class="bi bi-phone me-1"></i>Mobile Dev</span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- SECTION 3: ACHIEVEMENTS (VERTICAL STACK) -->
  <section class="section-certificates py-5">
    <div class="container">
      <h3 class="text-center mb-5 fw-light">Achievements</h3>
      <div class="cert-vertical">
        <!-- Cyber Juara 3 -->
        <div class="cert-card mb-4">
          <div class="cert-img landscape">
            <img src="img/cert-cyber-juara3.jpg" alt="Juara 3 Cyber" class="img-fluid">
          </div>
        </div>
        <!-- Cloud Certification -->
        <div class="cert-card mb-4">
          <div class="cert-img landscape">
            <img src="img/cert-cloud.jpg" alt="Cloud Certification" class="img-fluid">
          </div>
        </div>
        <!-- Cyber Peserta -->
        <div class="cert-card mb-4">
          <div class="cert-img landscape">
            <img src="img/cert-cyber-peserta.jpg" alt="Cyber Participant" class="img-fluid">
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- LIGHTBOX dengan tombol close -->
  <div id="lightbox">
    <span class="close-lightbox"><i class="bi bi-x-lg"></i></span>
    <img src="" alt="">
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
