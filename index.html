<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghozy Portfolio</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
</head>

<body>

<div class="bg-grid"></div>

<!-- HERO -->
<section class="hero-fullscreen">

  <h1 class="glow">COMING SOON</h1>

  <div class="progress-custom">
    <div class="bar"></div>
  </div>

  <p class="progress-text">Portfolio 75% in progress</p>

  <a href="#profile-section" class="arrow-down">
    <i class="bi bi-chevron-down"></i>
  </a>

</section>

<!-- PROFILE -->
<section id="profile-section" class="section">

  <div class="profile-wrapper">
    <img src="img/profile-full.png" class="profile-img">
  </div>

  <h2 class="hero-role">
    Cybersecurity Engineer
    <span>with expertise in Cloud, Fullstack, Mobile & Desktop Development</span>
  </h2>

  <p class="desc">
    I’m building my next-generation portfolio and focusing on secure,
    scalable and high-performance application development.
  </p>

</section>

<!-- ACHIEVEMENTS -->
<section class="section achievements-section">

  <h2 class="section-title">Achievements</h2>

  <div class="cert-grid">

    <div class="cert-card">
      <img src="img/cert-cyber-juara3.jpg">
    </div>

    <div class="cert-card">
      <img src="img/cert-cloud.jpg">
    </div>

    <div class="cert-card">
      <img src="img/cert-cyber-peserta.jpg">
    </div>

  </div>

</section>

<!-- LIGHTBOX -->
<div id="lightbox">
  <span class="close-lightbox"><i class="bi bi-x-lg"></i></span>
  <img src="">
</div>

<script src="script.js"></script>
</body>
</html>
